spring:
  application:
    name: gateway

wassal:
  upstream:
    order-service: ${WASSAL_ORDER_SERVICE:http://localhost:8081}

server:
  port: ${WASSAL_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
