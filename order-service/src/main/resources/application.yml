spring:
  application:
    name: order-service
  datasource:
    url: ${WASSAL_DB_URL:jdbc:postgresql://localhost:5432/wassal}
    username: ${WASSAL_DB_USER:order_svc}
    password: ${WASSAL_DB_PASSWORD:order_svc}
    hikari:
      # Sized explicitly per service (architecture review F-5). Background work must not
      # starve the request path, and pool exhaustion presents as latency rather than error.
      maximum-pool-size: 12
      pool-name: order-main
  flyway:
    enabled: true
    schemas: orders
    default-schema: orders
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${WASSAL_KAFKA:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-assignment-lifecycle
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

wassal:
  topics:
    assignment-lifecycle: assignment.lifecycle
  outbox:
    topic: order.lifecycle
    poll-interval-ms: 100
    batch-size: 100

server:
  port: ${WASSAL_PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # health + prometheus ONLY (security A-3). env/heapdump/threaddump leak configuration
        # and memory contents; they stay closed.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: order-service

logging:
  level:
    root: INFO
    dev.wassal: INFO
