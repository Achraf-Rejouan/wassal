# Wassal — core profile (S1-02).
#
# Every service declares mem_limit. NFR-011's budget is tight and unenforced limits blow it:
# six JVMs at default heap plus Redpanda's default reservation exceed 6 GB before Postgres is
# counted (architecture review F-6). S1-15 measures the real footprint on native Fedora Docker
# and restates the targets against it — the numbers below are provisional until then.
#
# Startup ordering is by health check, never by sleep. A `docker compose up` that needs a
# second attempt fails NFR-007 and is treated as a defect.

name: wassal

services:
  postgres:
    image: postgis/postgis:16-3.4
    mem_limit: 768m
    environment:
      POSTGRES_DB: wassal
      POSTGRES_USER: wassal
      POSTGRES_PASSWORD: wassal
    command: >
      postgres -c shared_buffers=256MB -c max_connections=100
    ports:
      - "5432:5432"   # local convenience only — the hosted overlay publishes nothing (A-4)
    volumes:
      - pgdata:/var/lib/postgresql/data
      # `z` relabels for SELinux — Fedora runs Enforcing by default and denies
      # container access to un-labelled bind mounts (see docs/bug-log.md).
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wassal -d wassal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    # noeviction is deliberate: under memory pressure the correct behaviour is to fail loudly.
    # An evicted geo entry is an invisible correctness degradation, which is exactly the class
    # of failure this project exists to expose.
    command: >
      redis-server --maxmemory 200mb --maxmemory-policy noeviction --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    mem_limit: 1024m
    # The default memory reservation is the single largest offender against NFR-011.
    # --memory must sit BELOW mem_limit: seastar allocates up front and fails hard if
    # the cgroup cannot satisfy the full request (see docs/bug-log.md).
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=896M
      - --overprovisioned
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: order-service
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      WASSAL_DB_URL: jdbc:postgresql://postgres:5432/wassal
      WASSAL_DB_USER: order_svc
      WASSAL_DB_PASSWORD: order_svc
      WASSAL_KAFKA: redpanda:9092
      WASSAL_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  dispatch-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: dispatch-service
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      WASSAL_DB_URL: jdbc:postgresql://postgres:5432/wassal
      WASSAL_DB_USER: dispatch_svc
      WASSAL_DB_PASSWORD: dispatch_svc
      WASSAL_KAFKA: redpanda:9092
      WASSAL_REDIS_HOST: redis
      WASSAL_PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway-1:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: gateway
    mem_limit: 384m
    environment: &gateway_env
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      WASSAL_ORDER_SERVICE: http://order-service:8081
      WASSAL_REDIS_HOST: redis
      WASSAL_PORT: "8080"
    ports:
      # Published individually so the cross-instance fan-out proof can connect to a SPECIFIC
      # instance and show that delivery is not an artefact of both ends landing on the same one.
      - "18081:8080"
    depends_on:
      order-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: &gateway_health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A SECOND instance by default, not only in tests. Cross-instance WebSocket fan-out is the
  # design's headline capability, and running one gateway would leave it visible only inside a
  # test nobody runs (architecture review F-7).
  gateway-2:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: gateway
    mem_limit: 384m
    environment: *gateway_env
    ports:
      - "18082:8080"
    depends_on:
      order-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *gateway_health

  proxy:
    image: caddy:2.8-alpine
    mem_limit: 64m
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "8080:80"
    depends_on:
      gateway-1: { condition: service_healthy }
      gateway-2: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  tracking-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: tracking-service
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      WASSAL_DB_URL: jdbc:postgresql://postgres:5432/wassal
      WASSAL_DB_USER: tracking_svc
      WASSAL_DB_PASSWORD: tracking_svc
      WASSAL_REDIS_HOST: redis
      WASSAL_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  simulator:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: simulator
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      WASSAL_REDIS_HOST: redis
      WASSAL_GATEWAY_URL: http://proxy:80
      WASSAL_DISPATCH_URL: http://dispatch-service:8082
      WASSAL_TRACKING_URL: http://tracking-service:8083
      WASSAL_SIM_ENABLED: "${WASSAL_SIM_ENABLED:-true}"
      WASSAL_SIM_SEED: "${WASSAL_SIM_SEED:-42}"
      WASSAL_SIM_PROFILE: "${WASSAL_SIM_PROFILE:-standard}"
      WASSAL_SIM_GROUND_TRUTH_DIR: /data/ground-truth
    volumes:
      - groundtruth:/data/ground-truth
    depends_on:
      proxy: { condition: service_healthy }
      dispatch-service: { condition: service_healthy }
      tracking-service: { condition: service_healthy }

volumes:
  pgdata:
  groundtruth:
